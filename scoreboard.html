<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="app">
        <div class="game-info">
            <div class="period-box">
                <span class="label">PERIOD</span>
                <div class="period-controls">
                    <button class="mini-btn" onclick="changePeriod(-1)">-</button>
                    <span id="period">1</span>
                    <button class="mini-btn" onclick="changePeriod(1)">+</button>
                </div>
           </div>

          <div class="timer-box">
              <span id="timer">10:00</span>
              <div class="timer-controls">
                <button class="mini-btn" onclick="startTimer()">▶</button>
                <button class="mini-btn" onclick="pauseTimer()">⏸</button>
                <button class="mini-btn" onclick="resetTimer()">⟲</button>
             </div>
          </div>
        </div>
        <div class="scoreboard">
            <div class="home-team">
                <h1 class="team-name">HOME</h1>
                <div class="score-display" id="home-score"> 0</div>
                <div class="boutons">
                    <button class="btn" onclick="addone()">+1</button>
                    <button class="btn" onclick="addtwo()">+2</button>
                    <button class="btn" onclick="addthree()">+3</button>
                </div>
                <div class="fouls-box">
                    <span class="label">FOULS</span>
                    <span id="home-fouls">0</span>
                    <button class="mini-btn" onclick="addFoul('home')">+</button>
                </div>  
                
            </div>

          <button class="reset-btn" onclick="resetScores()">
                   <svg class="reset-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M4 4V9H4.58152M19.9381 11C19.446 7.05369 16.0796 4 12 4C8.64262 4 5.76829 6.06817 4.58152 9M4.58152 9H9M20 20V15H19.4185M19.4185 15C18.2317 17.9318 15.3574 20 12 20C7.92038 20 4.55399 16.9463 4.06189 13M19.4185 15H15" 
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                   </svg>
          </button>

            <div class="guest-team">
                 <h1 class="team-name">GUEST</h1>
                 <div class="score-display" id="guest-score"> 0</div>
                 <div class="boutons">
                    <button class="btn" onclick="adone()">+1</button>
                    <button class="btn" onclick="adtwo()">+2</button>
                    <button class="btn" onclick="adthree()">+3</button>
                 </div> 
                 <div class="fouls-box">
                    <span class="label">FOULS</span>
                    <span id="guest-fouls">0</span>
                    <button class="mini-btn" onclick="addFoul('guest')">+</button>
                </div>
            </div>
        </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
